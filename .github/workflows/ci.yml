name: Website CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.17.0

jobs:
  website:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install website dependencies
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < ../.node-version)" = "$NODE_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          npm ci

      - name: Test website
        working-directory: website
        run: npm test

      - name: Verify published website assets
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cd ..
          git diff --exit-code -- index.html assets
          test -z "$(git status --porcelain=v1 --untracked-files=all -- index.html assets)"
